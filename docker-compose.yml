services:
  postgres:
    image: postgres:16-alpine
    container_name: valaria-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: valaria
      POSTGRES_PASSWORD: valaria_secret
      POSTGRES_DB: valaria_db
    ports:
      - "5432:5432"
    volumes:
      - valaria_pgdata:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./backend/src/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U valaria -d valaria_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  valaria_pgdata:
